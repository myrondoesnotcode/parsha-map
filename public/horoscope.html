    display: flex;

  .logo-name {

  .logo-sub {

    letter-spacing: 0.15em;

  .header-divider {

    font-family: 'Noto Serif', serif;

    font-weight: 600;
    color: var(--on-surface);
    line-height: 1.25;
    margin-bottom: 6px;

  .page-subtitle {
    font-size: 13px;
    color: var(--on-surface-variant);
    line-height: 1.6;
    margin-bottom: 32px;
  }

  /* ── Form ── */
  .field-label {
    display: block;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--on-surface-variant);
    margin-bottom: 6px;
  }

  input[type="date"] {
    width: 100%;
    padding: 10px 12px;
    background: white;
    border: 1px solid var(--outline-variant);
    border-radius: 2px;
    color: var(--on-surface);
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    margin-bottom: 20px;
    outline: none;
    transition: border-color 0.15s;
    -webkit-appearance: none;
    appearance: none;

    border-color: var(--primary);
  }

    width: 100%;
    padding: 11px 16px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 2px;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    letter-spacing: 0.04em;
    text-transform: uppercase;

    font-size: 12px;
    color: var(--error);
    margin-top: 10px;
    display: none;
  }

    margin-top: 32px;
    padding: 32px;
    background: var(--surface-low);
    border: 1px solid var(--outline-variant);
    border-radius: 2px;
    display: none;

// ── Hebrew calendar (pure JS, no CDN) ─────────────────────────────────────────

function jewishNewYear(year) {
  const months = Math.floor((235 * year - 234) / 19);
  const parts = 12084 + 13753 * months;
  let day = months * 29 + Math.floor(parts / 25920);
  if ((3 * (day + 1)) % 7 < 3) day++;
  return day;
}

function isLeapYear(year) { return (7 * year + 1) % 19 < 7; }
function daysInYear(year) { return jewishNewYear(year + 1) - jewishNewYear(year); }

function daysInMonth(month, year) {
  switch (month) {
    case 1: return 30; case 2: return 29; case 3: return 30; case 4: return 29;
    case 5: return 30; case 6: return 29; case 7: return 30;
    case 8: return daysInYear(year) % 10 === 5 ? 30 : 29;
    case 9: return daysInYear(year) % 10 === 3 ? 29 : 30;
    case 10: return 29; case 11: return 30;
    case 12: return isLeapYear(year) ? 30 : 29;
    case 13: return 29; default: return 0;
  }
}

function gregorianToJD(y, m, d) {
  return 367*y - Math.floor(7*(y + Math.floor((m+9)/12))/4)
    - Math.floor(3*(Math.floor((y+(m-9)/7)/100)+1)/4)
    + Math.floor(275*m/9) + d + 1721028.5;
}

function jdToHebrew(jd) {
  jd = Math.floor(jd - 347996.5);
  let year = Math.floor(jd * 19 / 6935) + 1;
  while (jewishNewYear(year + 1) <= jd) year++;
  while (jewishNewYear(year) > jd) year--;
  const tishri1 = jewishNewYear(year);
  let elapsed = jd - tishri1;
  const months = 12 + (isLeapYear(year) ? 1 : 0);
  const order = [];
  for (let m = 7; m <= months + 6; m++) order.push(m > months ? m - months : m);
  let month = 7, day = elapsed + 1;
  for (let i = 0; i < order.length - 1; i++) {
    const len = daysInMonth(order[i], year);
    if (day <= len) { month = order[i]; break; }
    day -= len; month = order[i + 1];
  }
  return { year, month, day };
}

const MONTH_NAMES = ['','Nisan','Iyyar','Sivan','Tammuz','Av','Elul','Tishri','Cheshvan','Kislev','Tevet','Shevat','Adar','Adar II'];
function formatHebrewDate(hd) { return `${hd.day} ${MONTH_NAMES[hd.month]} ${hd.year}`; }

function hDateToAbsolute(year, month, day) {
  let abs = jewishNewYear(year) - 1 + day;
  if (month < 7) {
    const months = 12 + (isLeapYear(year) ? 1 : 0);
    for (let m = 7; m <= months; m++) abs += daysInMonth(m, year);
    for (let m = 1; m < month; m++) abs += daysInMonth(m, year);
  } else {
    for (let m = 7; m < month; m++) abs += daysInMonth(m, year);
  }
  return abs;
}

// All parshiyot with display names
const ALL_PARSHIYOT = [
  "Bereishit","Noach","Lech Lecha","Vayeira","Chayei Sara","Toldot",
  "Vayeitzei","Vayishlach","Vayeishev","Miketz","Vayigash","Vayechi",

  "Shoftim","Ki Teitzei","Ki Tavo","Nitzavim","Vayeilech","Ha'azinu"
];

function buildSchedule(year, israel) {
  const len = daysInYear(year);
  const complete = len === 355 || len === 385;
  const deficient = len === 353 || len === 383;
  const leap = isLeapYear(year);
  const rhJsDow = (jewishNewYear(year) + 1) % 7; // 0=Sun..6=Sat
  const rhDow = rhJsDow + 1; // Hebrew day numbering: 2=Mon, 3=Tue, 5=Thu, 7=Sat

  const combineOptions = israel
    ? ["Vayakhel-Pekudei","Tazria-Metzora","Achrei Mot-Kedoshim","Behar-Bechukotai","Chukat-Balak","Matot-Masei","Nitzavim-Vayeilech"]
    : ["Vayakhel-Pekudei","Tazria-Metzora","Achrei Mot-Kedoshim","Behar-Bechukotai","Matot-Masei","Nitzavim-Vayeilech"];

  const pairs = {
    "Vayakhel-Pekudei":     ["Vayakhel","Pekudei"],
    "Tazria-Metzora":       ["Tazria","Metzora"],
    "Achrei Mot-Kedoshim":  ["Achrei Mot","Kedoshim"],
    "Behar-Bechukotai":     ["Behar","Bechukotai"],
    "Chukat-Balak":         ["Chukat","Balak"],
    "Matot-Masei":          ["Matot","Masei"],
    "Nitzavim-Vayeilech":   ["Nitzavim","Vayeilech"],
  };

  const table = {
    "2-d-R-D":47,"2-d-R-IL":47,"2-r-R-D":47,"2-r-R-IL":47,
    "3-c-R-D":49,"3-c-R-IL":49,"5-r-R-D":48,"5-r-R-IL":48,
    "5-c-R-D":49,"5-c-R-IL":49,"7-d-R-D":47,"7-d-R-IL":47,
    "7-r-R-D":48,"7-r-R-IL":48,
    "2-d-L-D":51,"2-d-L-IL":52,"2-r-L-D":51,"2-r-L-IL":52,
    "2-c-L-D":51,"2-c-L-IL":52,"3-r-L-D":51,"3-r-L-IL":52,
    "3-c-L-D":51,"3-c-L-IL":52,"5-d-L-D":51,"5-d-L-IL":52,
    "5-r-L-D":51,"5-r-L-IL":52,"5-c-L-D":51,"5-c-L-IL":52,
    "7-d-L-D":51,"7-d-L-IL":52,"7-r-L-D":51,"7-r-L-IL":52,
    "7-c-L-D":51,"7-c-L-IL":52,
  };

  const key = `${rhDow}-${complete?'c':deficient?'d':'r'}-${leap?'L':'R'}-D`;
  const numSedras = table[key] || (leap ? 51 : 48);
  let needed = 53 - numSedras;
  let sequence = [...ALL_PARSHIYOT];

  for (const combo of combineOptions) {
    if (needed <= 0) break;
    const [a, b] = pairs[combo];
    const ia = sequence.indexOf(a);
    if (ia !== -1 && sequence[ia + 1] === b) { sequence.splice(ia, 2, combo); needed--; }
  }

  return sequence;
}

function getShabbatOnOrAfter(gy, gm, gd) {
  const d = new Date(gy, gm - 1, gd);
  const add = d.getDay() === 6 ? 0 : (6 - d.getDay());
  d.setDate(d.getDate() + add);
  return d;
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.classList.add('visible');
  document.getElementById('result').classList.remove('visible');
}

function revealPortion() {
  document.getElementById('error-msg').classList.remove('visible');
  const val = document.getElementById('datepicker').value;
  if (!val) { showError('Please select a date first.'); return; }

  const [gy, gm, gd] = val.split('-').map(Number);

  // Hebrew date of the birthday itself
  const jdBirthday = gregorianToJD(gy, gm, gd);
  const hdBirthday = jdToHebrew(jdBirthday);

  // Shabbat on or after the birthday
  const shabbat = getShabbatOnOrAfter(gy, gm, gd);
  const jd = gregorianToJD(shabbat.getFullYear(), shabbat.getMonth() + 1, shabbat.getDate());
  const hd = jdToHebrew(jd);

  const absShabbat = hDateToAbsolute(hd.year, hd.month, hd.day);

  // Bereishit is read the first Shabbat after Simchat Torah (Tishri 23, Diaspora).
  // The schedule built by buildSchedule starts at Bereishit (index 0), so weekIdx
  // must count from that Shabbat, not from the first Shabbat of the Hebrew year.
  function bereishitShabbat(yr) {
    const absSimchatTorah = hDateToAbsolute(yr, 7, 23);
    const stDow = (absSimchatTorah + 1) % 7; // JS day-of-week
    return absSimchatTorah + (stDow === 6 ? 7 : 6 - stDow);
  }

  const absBereishitShabbat = bereishitShabbat(hd.year);
  const weekIdx = Math.round((absShabbat - absBereishitShabbat) / 7);

  let schedule, offset;
  if (weekIdx < 0) {
    schedule = buildSchedule(hd.year - 1, false);
    offset = Math.round((absShabbat - bereishitShabbat(hd.year - 1)) / 7);
  } else {
    schedule = buildSchedule(hd.year, false);
    offset = weekIdx;
  }

  let scheduleName = offset >= schedule.length
    ? buildSchedule(hd.year + 1, false)[offset - schedule.length]
    : schedule[offset];

  if (!scheduleName) {
    showError('This date falls on a major holiday — no regular parsha is read. Try an adjacent date.');
    return;
  }

  const dataKey = SCHEDULE_TO_DATA[scheduleName];
  const data = dataKey ? parshaData[dataKey] : null;

  if (!data) {
    showError(`Parsha data not found for "${scheduleName}". Please try another date.`);
    return;
  }

  const hebrewDateStr = formatHebrewDate(hdBirthday);

  document.getElementById('result-parsha').textContent = (dataKey || scheduleName).toUpperCase();
  document.getElementById('result-archetype').textContent = data.archetype;
  document.getElementById('result-hebrew-date').textContent = hebrewDateStr + ' · ' + scheduleName;
  document.getElementById('result-reading').textContent = data.reading;
  document.getElementById('result-question').textContent = data.question;
  document.getElementById('result-shadow').textContent = data.shadow;
  document.getElementById('result-people').textContent = data.people;
  document.getElementById('result-watchout').textContent = data.watchout;
  document.getElementById('result-thrive').textContent = parshaThrive[dataKey] || '';

  const slug = PARSHA_SLUG[dataKey] || dataKey.toLowerCase().replace(/\s+/g, '-').replace(/['']/g, '');
  document.getElementById('result-map-link').href = 'https://parshamap.com/?parsha=' + slug;

  const resultEl = document.getElementById('result');
  resultEl.classList.add('visible');
  resultEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  const words = text.split(' ');
  let line = '';
  let lineCount = 0;
  for (const word of words) {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width > maxWidth && line) {
      ctx.fillText(line, x, y + lineCount * lineHeight);
      lineCount++;
      line = word;
    } else {
      line = test;
    }
  }
  if (line) { ctx.fillText(line, x, y + lineCount * lineHeight); lineCount++; }
  return lineCount;
}

function truncate(text, max) {
  return text.length > max ? text.slice(0, max).trimEnd() + '…' : text;
}

async function generateShareCard() {
  await document.fonts.ready;

  const parsha    = document.getElementById('result-parsha').textContent;
  const archetype = document.getElementById('result-archetype').textContent;
  const reading   = document.getElementById('result-reading').textContent;
  const question  = document.getElementById('result-question').textContent;
  const shadow    = document.getElementById('result-shadow').textContent;
  const people    = document.getElementById('result-people').textContent;
  const watchout  = document.getElementById('result-watchout').textContent;
  const thrive    = document.getElementById('result-thrive').textContent;

  // Fixed IG story dimensions (9:16)
  const CW = 1080, CH = 1920;
  const PAD = 96;       // horizontal padding
  const TOP = 260;      // top safe zone (IG UI overlays ~250px)
  const BOTTOM = 220;   // bottom safe zone (IG reply bar)
  const W = CW - PAD * 2;

  const canvas = document.createElement('canvas');
  canvas.width = CW;
  canvas.height = CH;
  const ctx = canvas.getContext('2d');

  // ── App color palette ──
  const C = {
    bg:        '#f7f0e4',  // warm off-white (slightly richer than screen bg)
    primary:   '#6c2f00',  // burnt sienna
    onSurface: '#1c1c17',  // near-black
    variant:   '#54433a',  // warm brown-gray
    muted:     '#877369',  // outline color
    divider:   '#dac2b6',  // outline-variant
  };

  // Background
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, CW, CH);

  // Subtle warm vignette at top
  const grad = ctx.createLinearGradient(0, 0, 0, 400);
  grad.addColorStop(0, 'rgba(108, 47, 0, 0.05)');
  grad.addColorStop(1, 'rgba(108, 47, 0, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, CW, 400);

  // Top accent bar
  ctx.fillStyle = C.primary;
  ctx.fillRect(0, 0, CW, 10);

  let y = TOP; // start in IG safe zone

  // ── Header ──
  ctx.fillStyle = C.muted;
  ctx.font = '600 16px Inter, sans-serif';
  ctx.fillText('PARSHA HOROSCOPE', PAD, y);
  y += 52;

  ctx.fillStyle = C.primary;
  ctx.font = '600 34px Inter, sans-serif';
  ctx.fillText(parsha, PAD, y);
  y += 20;

  ctx.fillStyle = C.onSurface;
  ctx.font = '600 68px "Noto Serif", Georgia, serif';
  const archLines = wrapText(ctx, archetype, PAD, y + 66, W, 80);
  y += archLines * 80 + 66 + 40;

  // ── Divider ──
  drawDiv(ctx, PAD, y, CW - PAD);
  y += 40;

  // ── Full reading ──
  ctx.fillStyle = C.onSurface;
  ctx.font = '24px "Noto Serif", Georgia, serif';
  const readLines = wrapText(ctx, reading, PAD, y, W, 38);
  y += readLines * 38 + 40;

  // ── Divider ──
  drawDiv(ctx, PAD, y, CW - PAD);
  y += 40;

  // ── Question ──
  ctx.fillStyle = C.primary;
  ctx.font = '600 15px Inter, sans-serif';
  ctx.fillText('YOUR LIFE\u2019S QUESTION', PAD, y);
  y += 30;

  ctx.fillStyle = C.onSurface;
  ctx.font = 'italic 28px "Noto Serif", Georgia, serif';
  const qLines = wrapText(ctx, '\u201c' + question + '\u201d', PAD, y, W, 42);
  y += qLines * 42 + 32;

  // ── Sections ──
  y = drawSect(ctx, 'YOUR SHADOW', shadow, PAD, y, W, true);
  y = drawSect(ctx, 'YOUR PEOPLE', people, PAD, y, W, true);
  y = drawSect(ctx, 'WATCH OUT FOR', watchout, PAD, y, W, true);
  y = drawSect(ctx, 'WHERE YOU THRIVE', thrive, PAD, y, W, false);

  // ── Branding anchored to bottom safe zone ──
  const brandY = CH - BOTTOM;
  drawDiv(ctx, PAD, brandY - 44, CW - PAD);

  ctx.fillStyle = C.primary;
  ctx.font = '600 22px Inter, sans-serif';
  ctx.fillText('parshamap.com/horoscope', PAD, brandY);

  // Pin mark
  ctx.fillStyle = C.primary;
  const px = CW - PAD - 9, py = brandY - 7;
  ctx.beginPath(); ctx.arc(px, py - 9, 8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(px - 8, py - 9);
  ctx.quadraticCurveTo(px, py + 5, px, py + 5);
  ctx.quadraticCurveTo(px + 8, py - 9, px + 8, py - 9);
  ctx.fill();
  ctx.fillStyle = C.bg;
  ctx.beginPath(); ctx.arc(px, py - 9, 3.5, 0, Math.PI * 2); ctx.fill();

  // ── Share or download ──
  const btn = document.querySelector('.share-btn');
  const originalHTML = btn.innerHTML;
  btn.textContent = 'Saving\u2026';
  btn.disabled = true;

  const fileName = 'parsha-horoscope-' + parsha.toLowerCase().replace(/\s+/g, '-') + '.png';

  canvas.toBlob(async blob => {
    try {
      // On mobile: use native share sheet (Save Image, Instagram, etc.)
      const file = new File([blob], fileName, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({
          files: [file],
          title: 'My Parsha Horoscope',
          text: parsha + ' \u2014 ' + archetype + '. Discover yours at parshamap.com/horoscope',
        });
      } else {
        // Desktop fallback: download
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = fileName;
        a.click();
        URL.revokeObjectURL(a.href);
      }
    } catch (e) {
      // User cancelled share sheet — that's fine
      if (e.name !== 'AbortError') console.error(e);
    }
    btn.innerHTML = originalHTML;
    btn.disabled = false;
  }, 'image/png');
}

function drawDiv(ctx, x1, y, x2) {
  ctx.strokeStyle = '#dac2b6';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x1, y);
  ctx.lineTo(x2, y);
  ctx.stroke();
}

function drawSect(ctx, label, text, x, y, maxW, italic) {
  ctx.fillStyle = '#877369';
  ctx.font = '600 15px Inter, sans-serif';
  ctx.fillText(label, x, y);
  y += 26;

  ctx.fillStyle = italic ? '#54433a' : '#1c1c17';
  ctx.font = (italic ? 'italic ' : '') + '24px "Noto Serif", Georgia, serif';
  const n = wrapText(ctx, text, x, y, maxW, 36);
  return y + n * 36 + 28;
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') revealPortion(); });
</script>
